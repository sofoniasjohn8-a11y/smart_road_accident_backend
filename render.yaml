# Render Blueprint for the Smart Road Accident Detection backend.
# Deploy from the Render dashboard: New -> Blueprint -> select this repository.
# Docs: https://render.com/docs/blueprint-spec
#
# After the first deploy the API is served at https://<service-name>.onrender.com
# (see README.md "Public HTTPS deployment" for the API contract).

services:
  - type: web
    name: road-accident-api
    runtime: node
    plan: free
    region: frankfurt
    buildCommand: npm ci --no-audit --no-fund
    # Free Render services do not support pre-deploy commands.
    # The schema is idempotent, so applying it at startup is safe.
    startCommand: npm run db:migrate && npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_SSL
        value: "true"
      # Render generates a strong random value; overwrite it in the dashboard
      # if you want to control it yourself.
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 8h
      # Required to boot: JSON object of device IDs to secrets, each secret
      # at least 32 characters, e.g. {"ROAD_DEVICE_001":"<43-char random string>"}
      - key: DEVICE_API_KEYS
        sync: false
      # Native mobile apps do not enforce CORS; set this only for a web client
      # origin you want to allow (comma-separated list).
      - key: CORS_ORIGINS
        value: ""
